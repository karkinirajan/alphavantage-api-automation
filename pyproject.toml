[project]
name = "alphavantage-dashboard"
version = "0.1.0"
description = "A small Flask dashboard on the Alpha Vantage API: market status, top movers, candlestick and comparison charts, with user accounts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "gunicorn>=23",
]

[project.scripts]
alphavantage-dashboard = "alphavantage_dashboard.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphavantage_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["alphavantage_dashboard"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
